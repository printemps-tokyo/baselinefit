<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo site</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <main class="layout">
      <article class="card">

      </div>
    </main>

    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
