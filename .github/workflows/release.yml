name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  # The release is created once, before the matrix: jobs creating it at the
  # same moment used to collide, leaving one of them unable to upload.
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/baselinefit"
          tar -czf "baselinefit-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" baselinefit
      # Release integrity: publish a checksum next to every artifact so
      # consumers can verify what they downloaded (OSPS-BR-06.01).
      - name: Checksums
        shell: bash
        run: |
          shasum -a 256 "baselinefit-${{ matrix.target }}.tar.gz" \
            > "baselinefit-${{ matrix.target }}.tar.gz.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            baselinefit-${{ matrix.target }}.tar.gz
            baselinefit-${{ matrix.target }}.tar.gz.sha256
