name: Bug report
description: Report a problem
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: The line and the feature id
      description: >
        For a false positive or a false negative, paste the source line that did
        or did not match, the feature id from `baselinefit --list`, and the
        `--target` you used. That is usually enough to fix it.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: "v0.1.0 / macOS / rustc 1.97.1"
    validations:
      required: false
